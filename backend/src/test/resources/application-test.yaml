spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:beacon_attendance_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

app:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key
    access-token-expiration-ms: 3600000
