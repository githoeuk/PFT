server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      tracking-modes: cookie
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: beacon-attendance

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    com.example.demo: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap:
    super-admin:
      login-id: ${SUPER_ADMIN_LOGIN_ID:}
      password: ${SUPER_ADMIN_PASSWORD:}
      name: ${SUPER_ADMIN_NAME:Super Admin}
      phone: ${SUPER_ADMIN_PHONE:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
