name: Deploy Mobile Web

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mobile-web.yml"
      - "mobile/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Flutter web
        working-directory: mobile
        run: >
          flutter build web
          --base-href /PFT/
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --no-wasm-dry-run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
